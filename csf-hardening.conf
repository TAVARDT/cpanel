# ----------------------------------------------------------------------
# TAVARDT Elite CSF (ConfigServer Security & Firewall) Hardening
# ----------------------------------------------------------------------
# Instructions: These are critical B2B modifications for /etc/csf/csf.conf
# DO NOT overwrite your entire csf.conf, just find and update these keys.
# Run 'csf -r' after applying.
# ----------------------------------------------------------------------

# 1. Connection Tracking & Port Flood Protection
# Protects against Layer 4 DDoS and HTTP exhaustion attacks.
# Example: Limit port 80 and 443 to 50 connections per IP.
PORTFLOOD = "80;tcp;50;10,443;tcp;50;10"
CONNLIMIT = "80;50,443;50"

# 2. Prevent Mail Spam & Scripts (Crucial for cPanel shared environments)
# Alerts you if a compromised WordPress plugin starts sending massive emails.
LF_SCRIPT_ALERT = "1"
LF_SCRIPT_LIMIT = "100"

# 3. Distributed Attacks & Brute Force Prevention
# Permanently ban IPs that trigger the temporary block too many times.
LF_PERMBLOCK = "1"
LF_PERMBLOCK_INTERVAL = "86400"
LF_PERMBLOCK_COUNT = "4"

# 4. Directory Watching
# Monitors the /tmp and /dev/shm directories for malicious scripts (Web Shells).
LF_DIRWATCH = "300"
LF_DIRWATCH_FILE = "7200"

# 5. Geolocation Blocking (Optional but Highly Recommended for Local B2B)
# If your clients only operate in Brazil/US, block high-risk botnet countries.
# Example blocks Russia (RU) and China (CN). Requires MaxMind license key in CSF.
CC_DENY = "RU,CN,KP"

# 6. Process Tracking
# Suspends suspicious processes that run too long or consume too much memory.
PT_USERMEM = "512"
PT_USERTIME = "1800"

# 7. Symlink Attack Prevention (Kernel Level)
# Essential to stop hackers from jumping between cPanel accounts.
RESTRICT_SYSLOG = "3"
