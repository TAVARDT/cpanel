; ----------------------------------------------------------------------
; TAVARDT Elite PHP Security for cPanel/WHM
; ----------------------------------------------------------------------
; Instructions: Apply these settings globally via WHM -> MultiPHP Manager 
; -> System PHP-FPM Configuration, or in individual cPanel MultiPHP INI Editors.
; ----------------------------------------------------------------------

; 1. The Ultimate Web Shell Killer (Disable Functions)
; This single line prevents 99% of uploaded malware from executing OS commands.
; Warning: May break legacy or poorly coded backup plugins.
disable_functions = "exec,system,passthru,shell_exec,proc_close,proc_open,dl,popen,show_source,posix_kill,posix_mkfifo,posix_setpgid,posix_setsid,posix_setuid,wget,curl"

; 2. Hide PHP Identity from Hackers
; Prevents the "X-Powered-By: PHP/8.x" header.
expose_php = Off

; 3. Security against Remote File Inclusion (RFI)
; Prevents PHP from fetching and executing scripts from remote malicious servers.
allow_url_fopen = Off
allow_url_include = Off

; 4. Session Security
; Prevents JavaScript from reading session cookies (Mitigates XSS session hijacking).
session.cookie_httponly = 1
; Ensure sessions are only transmitted over HTTPS
session.cookie_secure = 1
; Enforce strict session IDs
session.use_strict_mode = 1

; 5. Secure File Uploads
; Restrict upload sizes to reasonable B2B limits.
upload_max_filesize = 64M
post_max_size = 64M
; Max execution time limits CPU exhaustion
max_execution_time = 60

; 6. Error Handling
; NEVER display raw PHP errors to the user (they leak server paths).
display_errors = Off
display_startup_errors = Off
log_errors = On
